services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    # Los cortes diarios del reporte financiero se hacen por fecha local:
    # en UTC los ingresos de la tarde caerían en el día siguiente.
    command: --default-time-zone=-05:00
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      TZ: America/Bogota
    ports:
      - "3310:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${DATABASE_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
      TZ: America/Bogota
    ports:
      - "8080:80"
    # El host solo tiene 512 MB: sin tope, phpMyAdmin puede dejar sin memoria
    # a la app y a MySQL, que son los que no pueden caerse.
    mem_limit: 128m

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: America/Bogota
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      JWT_SECRET: ${JWT_SECRET}
      # Se sirve por HTTP: un cookie Secure no llegaría a guardarse y el panel
      # de administración no podría iniciar sesión. Quitar al montar HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    ports:
      - "3002:3000"
    volumes:
      - ./public/uploads:/app/public/uploads

volumes:
  mysql-data:
